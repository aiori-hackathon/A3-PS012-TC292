options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { none; };
    recursion yes;
    allow-recursion { any; };
    allow-query { any; };
    dnssec-validation no;
    forwarders { };
};

zone "probe.lab.test" {
    type forward;
    forward only;
    forwarders { 172.28.0.10; };
};

zone "owned.t01.lab.test" {
    type master;
    file "/etc/bind/zones/owned.t01.lab.test.zone";
};
