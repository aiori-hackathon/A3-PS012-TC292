options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { none; };
    recursion yes;
    allow-recursion { 127.0.0.1; };
    allow-query { any; };
    dnssec-validation no;
};

zone "owned.t02.lab.test" {
    type master;
    file "/etc/bind/zones/owned.t02.lab.test.zone";
};
